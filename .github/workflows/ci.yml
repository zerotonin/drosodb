name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # opencv-python needs a few OS libs at runtime (import-time). They're
      # available on ubuntu-latest but not always pre-pulled; apt is a
      # one-liner here and avoids a confusing segfault in the test matrix.
      - name: Install OpenCV runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libxkbcommon0 libegl1 libdbus-1-3

      - name: Install package + CI deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Apply migrations (smoke check)
        run: alembic upgrade head
        env:
          DDB_DATABASE_URL: sqlite:///./ci.sqlite3

      - name: Pytest
        run: pytest -ra
        env:
          # Keep the GUI smoke test off any real display; Qt ships this
          # plugin with PySide6 so we don't need xvfb.
          QT_QPA_PLATFORM: offscreen
          # Point at the same migrated DB the previous step set up.
          # Tests that use the `session` fixture create their own
          # in-memory engine in conftest and ignore this; the GUI smoke
          # tests use the global engine and therefore need a real,
          # schema-bearing file behind it. Without this, ReportsTab's
          # auto-load on construction crashes with "no such table: vial".
          DDB_DATABASE_URL: sqlite:///./ci.sqlite3
