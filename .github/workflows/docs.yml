name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Build ────────────────────────────────────────────────────────────
  # Split from deploy so a transient Pages backend hiccup can be re-run
  # (deploy-only) without rebuilding the whole site.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build site
        run: mkdocs build --strict

      # enablement: true asks the action to turn GitHub Pages on via the
      # REST API if it isn't yet — removes the manual "enable Pages in
      # repo settings" step that was tripping the very first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # ── Deploy ───────────────────────────────────────────────────────────
  # actions/deploy-pages intermittently returns "Deployment failed, try
  # again later" from the Pages backend even on a perfectly good artifact.
  # First attempt is soft (continue-on-error); a single retry clears the
  # transient case without a manual re-run.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
