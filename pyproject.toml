[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddb"
version = "0.1.0"
description = "Drosophila Vial Tracking System"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "sqlmodel>=0.0.16",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "segno>=1.6",
    "pillow>=10.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]
hardware = [
    "opencv-python>=4.9",
    "brother_ql>=0.9",
    "PySide6>=6.6",
]

[project.scripts]
ddb = "ddb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
