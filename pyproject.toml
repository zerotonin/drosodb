[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddb"
version = "0.1.0"
description = "Drosophila Vial Tracking System"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "sqlmodel>=0.0.16",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "segno>=1.6",
    "pillow>=10.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]
hardware = [
    "opencv-python>=4.9",
    "brother_ql>=0.9",
    "zxing-cpp>=2.2",
]
gui = [
    "PySide6>=6.6",
    "opencv-python>=4.9",
]
# Everything CI needs to actually exercise the whole package — runtime
# deps, decoder backends, printer plumbing, GUI smoke test, plus the lint
# and test toolchain. Keep this as the single install line for CI.
ci = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "alembic>=1.13",
    "opencv-python>=4.9",
    "brother_ql>=0.9",
    "zxing-cpp>=2.2",
    "PySide6>=6.6",
]

[project.scripts]
ddb = "ddb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ddb.gui.sounds" = ["*.wav"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer idiom: defaults use typer.Option()/typer.Argument() calls.
"src/ddb/cli.py" = ["B008"]
# Qt idiom: QAbstractItemModel subclasses override methods whose signatures
# already use QModelIndex() as a default — we match the Qt API.
"src/ddb/gui/reports_tab.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
